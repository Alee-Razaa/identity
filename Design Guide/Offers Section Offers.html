                    imagesHtml += `<div class="dot-${offer.id} w-1.5 h-1.5 rounded-full transition-all duration-300 ${imgIdx === 0 ? 'bg-indigo-600 w-3' : 'bg-slate-300'}"></div>`;
                });
                imagesHtml += `</div></div>`;

                card.innerHTML = `

                        ${imagesHtml}

                startCardImageInterval(offer.id, offer.images.length);
            });

        function startCardImageInterval(offerId, totalImgs) {
            let currentImgIdx = 0;
            setInterval(() => {
                currentImgIdx = (currentImgIdx + 1) % totalImgs;
                const images = document.querySelectorAll(`.carousel-img-${offerId}`);
                const dots = document.querySelectorAll(`.dot-${offerId}`);
                
                images.forEach((img, idx) => {
                    if (idx === currentImgIdx) {
                        img.classList.replace('opacity-0', 'opacity-100');
                        img.classList.replace('z-0', 'z-10');
                    } else {
                        img.classList.replace('opacity-100', 'opacity-0');
                        img.classList.replace('z-10', 'z-0');
                    }
                });

                dots.forEach((dot, idx) => {
                    if (idx === currentImgIdx) {
                        dot.className = `dot-${offerId} w-3 h-1.5 rounded-full bg-indigo-600 transition-all duration-300`;
                    } else {
                        dot.className = `dot-${offerId} w-1.5 h-1.5 rounded-full bg-slate-300 transition-all duration-300`;
                    }
                });
            }, 3000);
        }

        function updateCarouselPosition() {
            const track = document.getElementById("carouselTrack");
            track.style.transform = `translateX(calc(-${currentIndex * (100 / visibleCards)}%))`;
        }

        function handlePrev() {
            stopAutoRoll();
            currentIndex = (currentIndex === 0) ? maxIndex : currentIndex - 1;
            updateCarouselPosition();
            startAutoRoll();
        }

        function handleNext() {
            stopAutoRoll();
            currentIndex = (currentIndex >= maxIndex) ? 0 : currentIndex + 1;
            updateCarouselPosition();
            startAutoRoll();
        }

        function startAutoRoll() {
            if(globalCarouselInterval) clearInterval(globalCarouselInterval);
            globalCarouselInterval = setInterval(() => {
                currentIndex = (currentIndex >= maxIndex) ? 0 : currentIndex + 1;
                updateCarouselPosition();
            }, 4500);
        }

        function stopAutoRoll() {
            if(globalCarouselInterval) clearInterval(globalCarouselInterval);
        }

                    <span class="text-xs font-black text-indigo-600 bg-indigo-50 px-2 py-1 rounded-lg">0${idx+1}</span>
                    <span class="text-xs text-slate-700 font-semibold leading-relaxed">${step}</span>
                </div>
            `).join('');
            let requirementsList = activeOffer.requirements.map(req => `<li class="pl-1 text-slate-600 font-medium">${req}</li>`).join('');

            leftContent.innerHTML = `
                <div>
                    <div class="inline-block bg-slate-100 text-slate-700 text-[10px] uppercase tracking-wider font-extrabold px-2.5 py-1 rounded-md mb-2">Detailed Scope</div>
                    <h3 class="text-3xl font-black text-slate-900 tracking-tight heading-tech">${activeOffer.title}</h3>
                    <p class="text-xs font-bold text-indigo-500 mt-2">"${activeOffer.tagline}"</p>
                </div>
                <p class="text-sm text-slate-500 leading-relaxed bg-slate-50 p-5 rounded-2xl border border-slate-100 shadow-inner">${activeOffer.longDesc}</p>
                <div class="space-y-4">
                    <h4 class="text-xs font-black uppercase tracking-wider text-emerald-600 flex items-center gap-1.5">✓ Base Handoff Deliverables</h4>
                    <ul class="space-y-3 text-xs font-medium pl-1">${deliverablesList}</ul>
                </div>
                <div class="space-y-4">
                    <h4 class="text-xs font-black uppercase tracking-wider text-slate-400 class flex items-center gap-1.5">✗ Strategic Upgrades Available Outside Base</h4>
                    <ul class="space-y-3 text-xs font-medium pl-1">${exclusionsList}</ul>
                </div>
                <div class="space-y-4 pt-2">
                    <h4 class="text-xs font-black uppercase tracking-wider text-indigo-600">Production Sprint Path</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${workflowGrid}</div>
                </div>
                <div class="space-y-4">
                    <h4 class="text-xs font-black uppercase tracking-wider text-amber-600">Pre-Requisites Required From Buyer</h4>
                    <ol class="space-y-2 text-xs list-decimal pl-4">${requirementsList}</ol>
                </div>
            `;

            renderAddons();
            updateCalculatedTotals();
            
            modal.style.display = "flex";
        }

        function renderAddons() {
            const container = document.getElementById("addonsContainer");
            container.innerHTML = "";
            
            activeOffer.addOns.forEach((addon, idx) => {
                const isChecked = activeAddonsList.includes(idx);
                const item = document.createElement("div");
                item.className = `p-4 rounded-2xl border transition-all cursor-pointer flex items-start gap-4 select-none ${isChecked ? 'bg-indigo-500/[0.04] border-indigo-400 text-slate-900 shadow-sm' : 'bg-white border-slate-200/60 text-slate-500 hover:border-slate-300'}`;
                item.onclick = () => toggleAddon(idx);
                
                item.innerHTML = `
                    <div class="w-5 h-5 rounded-lg mt-0.5 border flex items-center justify-center text-[10px] font-black ${isChecked ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-300 bg-white'}">
                        ${isChecked ? "✓" : ""}
                    </div>
                    <div class="flex-1 overflow-hidden">
                        <p class="text-xs font-bold text-slate-800 leading-tight">${addon.title}</p>
                        <p class="text-[10px] text-slate-400 font-medium mt-1">${addon.days === 0 ? "Instant implementation" : addon.days > 0 ? `+${addon.days} business days` : `${addon.days} business days`}</p>
                    </div>
                    <span class="text-sm font-extrabold text-indigo-600 heading-tech">+$${addon.price}</span>
                `;
                container.appendChild(item);
            });
        }

        function toggleAddon(idx) {
            if (activeAddonsList.includes(idx)) {
                activeAddonsList = activeAddonsList.filter(i => i !== idx);
            } else {
                activeAddonsList.push(idx);
            }
            renderAddons();
            updateCalculatedTotals();
        }

        function updateCalculatedTotals() {
            let finalPrice = activeOffer.price;
            let finalDays = activeOffer.deliveryDays;

            activeAddonsList.forEach(idx => {
                finalPrice += activeOffer.addOns[idx].price;
                finalDays += activeOffer.addOns[idx].days;
            });

            document.getElementById("calculatedPrice").innerText = `$${finalPrice}`;
            document.getElementById("calculatedDays").innerText = `${Math.max(1, finalDays)} Days Delivery`;
            document.getElementById("modalMetricsHeader").innerHTML = `
                <span>Traffic: ${activeOffer.views} Views</span>
                <span>Completed: ${activeOffer.sales} Units</span>
                <span class="text-indigo-600">★★★★★</span>
            `;
            document.getElementById("modalCtaBtn").href = activeOffer.ctaLink;
        }

        function closeOfferModal() {
            document.getElementById("detailModal").style.display = "none";
            startAutoRoll();
        }

        window.onload = () => {
            renderCarousel();
            startAutoRoll();
        };
    </script>
</body>
</html>
